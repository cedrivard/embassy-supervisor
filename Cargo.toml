# Workspace for the embassy task supervisor.
#
# - `supervisor` : the generalized, HAL-agnostic task-lifecycle supervisor (the
#   publishable `embassy-supervisor` crate). Pure embassy, no board specifics.
# - `supervisor-macros` : the proc-macro crate providing `supervisor_graph!`
#   (re-exported by `supervisor`; receives the forwarded `pool` feature).
# - `firmware`   : the RP2350 application that drives the supervisor over a
#   USB-CDC-NCM network with an HTTP control plane, an elastic worker pool, and OTA.
# - `bootloader` : the embassy-boot-rp A/B bootloader.
[workspace]
resolver = "2"
members = ["supervisor", "supervisor-macros", "firmware", "bootloader"]

[workspace.package]
edition = "2024"
authors = ["Cedric Rivard <cedric@rivard.info>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cedrivard/embassy-supervisor"
rust-version = "1.85"

# MEASUREMENT FIX BUILD (branch pr-executor-skip-empty-dequeue-fixed): builds
# the firmware against the run-queue idle-path change, where
# `RunQueue::dequeue_all` returns early on an empty queue instead of running
# `TransferStack::take_all`'s `swap`. On RP2350 that removes the exclusive that
# kept the thread executor's idle `WFE` from ever sleeping. See
# firmware/README.md for the measured behaviour; the sibling branch
# pr-executor-skip-empty-dequeue-main builds the same source against upstream
# main as the storming baseline.
#
# The last three entries are the path-dep closure of embassy-executor's own
# manifest; without them a second copy enters the graph alongside the crates.io
# ones (embassy-time also reaches embassy-executor-timer-queue, where a
# duplicate is a type mismatch).
[patch.crates-io]
embassy-executor = { git = "https://github.com/cedrivard/embassy", branch = "executor-skip-empty-dequeue" }
embassy-executor-macros = { git = "https://github.com/cedrivard/embassy", branch = "executor-skip-empty-dequeue" }
embassy-executor-timer-queue = { git = "https://github.com/cedrivard/embassy", branch = "executor-skip-empty-dequeue" }
embassy-time-driver = { git = "https://github.com/cedrivard/embassy", branch = "executor-skip-empty-dequeue" }

# Size/perf profile for the embedded binaries (mirrors the embassy templates).
[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = "s"          # 'z'/'s' so the unoptimized embassy build still fits/links
