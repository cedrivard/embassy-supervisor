# Workspace for the embassy task supervisor.
#
# - `supervisor` : the generalized, HAL-agnostic task-lifecycle supervisor (the
#   publishable `embassy-supervisor` crate). Pure embassy, no board specifics.
# - `supervisor-syntax` : the graph DSL's parser and AST, shared by the proc-macro
#   crate and any tooling that reads a declaration from source.
# - `supervisor-macros` : the proc-macro crate providing `supervisor_graph!`
#   (re-exported by `supervisor`; receives the forwarded `pool` feature).
# - `supervisor-tools` : host tools over a graph declaration read from source:
#   `supervisor-mermaid` (Mermaid diagrams) and `supervisor-lint` (dataflow lints).
# - `supervisor-observe` : the observation facade (`Observable`, `Counted`) a
#   signal library implements without depending on the supervisor.
# - `firmware`   : the RP2350 application that drives the supervisor over a
#   USB-CDC-NCM network with an HTTP control plane, an elastic worker pool, and OTA.
# - `bootloader` : the embassy-boot-rp A/B bootloader.
[workspace]
resolver = "2"
members = ["supervisor", "supervisor-syntax", "supervisor-macros", "supervisor-tools", "supervisor-observe", "firmware", "bootloader"]
default-members = ["supervisor", "supervisor-macros", "firmware", "bootloader"]

[workspace.package]
edition = "2024"
authors = ["Cedric Rivard <cedric@rivard.info>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cedrivard/embassy-supervisor"
homepage = "https://embassy-supervisor.github.io/"
rust-version = "1.88"

# No `[patch.crates-io]`: a release is verified against exactly what consumers
# resolve from the registry. The run-queue idle-path change (embassy-rs/embassy
# #6659) is merged upstream but unreleased; patch embassy-executor to git main
# locally when measuring the firmware's idle current, and drop the table again
# before cutting a version.

# Size/perf profile for the embedded binaries (mirrors the embassy templates).
[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = "s"          # 'z'/'s' so the unoptimized embassy build still fits/links
