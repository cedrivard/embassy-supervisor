[package]
name = "embassy-supervisor-syntax"
# Pinned by EXACT version from `embassy-supervisor-macros`: the AST is an
# internal contract between the two, not a stable public API, and it changes
# whenever the graph syntax does.
version = "0.3.1"
description = "Parser for the embassy-supervisor graph DSL, shared by its proc-macro and its tooling"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/embassy-supervisor-syntax"
keywords = ["embassy", "supervisor", "parser", "syn", "dsl"]
categories = ["embedded", "parser-implementations", "development-tools"]

# No `[features]`. The grammar is always accepted in full; which constructs a
# given build permits is the caller's policy.

[dependencies]
syn = { version = "3.0.4", features = ["full"] }
quote = "1.0.46"
proc-macro2 = "1.0.106"
