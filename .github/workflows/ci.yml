name: CI

# The workspace's five published crates, on the host and on the RP2350 target
# (thumbv8m), at the toolchain floor they declare, plus a build of the firmware
# and bootloader that use them.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job writes to the repository.
permissions:
  contents: read

# Cancel superseded pull-request runs on the same ref; pushes to main all run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The crate's only host target; spelled out so it's reused across jobs.
  HOST: x86_64-unknown-linux-gnu

jobs:
  # Host unit + integration tests. The workspace `.cargo/config.toml` pins the
  # embedded target, so every host command passes `--target $HOST` to override it.
  test:
    name: test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain the trybuild `.stderr` snapshots are blessed
      # with: rustc's diagnostics drift between releases (`stable-canary`
      # below tracks stable without failing the run).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          # rust-src changes how rustc renders const-eval panics whose frames
          # land in core (with the source it prints the annotated snippet;
          # without it, a bare `= note:` fallback). Three snapshot families
          # depend on it: dependency cycles, veto capacity and the deferred
          # const-assert panics, all blessed with the source available.
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p embassy-supervisor --target "$HOST"
      - run: cargo test -p embassy-supervisor --target "$HOST" --no-default-features
      - run: cargo test -p embassy-supervisor --target "$HOST" --all-features
      - run: cargo test -p embassy-supervisor --target "$HOST" --features control,pool,trace-hooks
      # The lifecycle-observability features together, without the rest of the
      # crate: events, breadcrumb, the watchdog gate, restart budget, enabled_if.
      - run: cargo test -p embassy-supervisor --target "$HOST" --features lifecycle-events,breadcrumb,restart-intensity,enabled-if,liveness-monitor,control
      # The sink alone, without the queue, so `lifecycle_sink` runs sink-only.
      - run: cargo test -p embassy-supervisor --target "$HOST" --features macros,lifecycle-sink,control
      # The name stamp without the trace layer: `--all-features` always has
      # `trace`, which takes the `adopt` path instead of `stamp_name`.
      - run: cargo test -p embassy-supervisor --target "$HOST" --features metadata-names
      # `supervisor_graph!` UI tests (trybuild): compile-fail cases lock the macro's
      # error contracts (cycle, unknown dep, ...); compile-pass cases run the generated
      # graph. Host-only — trybuild compiles real graphs — so `--target $HOST`.
      - run: cargo test -p embassy-supervisor-macros --target "$HOST"
      - run: cargo test -p embassy-supervisor-macros --target "$HOST" --all-features
      # The two macro features the dev-dependency does not force on: each picks a
      # different trybuild directory set in tests/ui.rs.
      - run: cargo test -p embassy-supervisor-macros --target "$HOST" --features local-resources
      - run: cargo test -p embassy-supervisor-macros --target "$HOST" --features heap-state

      # The graph grammar itself, which both the proc-macro and the diagram tool
      # parse with. It has no features: it always accepts the full syntax.
      - run: cargo test -p embassy-supervisor-syntax --target "$HOST"
      # The observation facade: no features either, by design.
      - run: cargo test -p embassy-supervisor-observe --target "$HOST"
      # The host tools over that grammar: `supervisor-mermaid` and `supervisor-lint`.
      - run: cargo test -p embassy-supervisor-tools --target "$HOST"
      # They must also still understand the graph the firmware actually
      # declares, in both views and with the legend on.
      - run: cargo run -q -p embassy-supervisor-tools --target "$HOST" --bin supervisor-mermaid -- --signals firmware/src/*.rs > /dev/null
      - run: cargo run -q -p embassy-supervisor-tools --target "$HOST" --bin supervisor-mermaid -- --runtime --legend firmware/src/*.rs > /dev/null
      # And the firmware's graph and its `#[dataflow]` fns must agree: any
      # coverage warning (a bound fn no file defines, a fn nothing binds) is a
      # failure here, not a line on stderr someone has to notice.
      - run: cargo run -q -p embassy-supervisor-tools --target "$HOST" --bin supervisor-mermaid -- --check firmware/src/*.rs
      # The dataflow itself: a one-sided signal in the firmware's graph fails
      # here. Accepted absences would be named with `--allow`, in this line.
      - run: cargo run -q -p embassy-supervisor-tools --target "$HOST" --bin supervisor-lint -- firmware/src/*.rs

  # The macro UI snapshots against the current stable rustc (allow-failure):
  # an early warning that the pinned toolchain in `test` is due to move.
  stable-canary:
    name: macro snapshots vs stable (canary)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p embassy-supervisor-macros --target "$HOST" --all-features

  # Every integration test with exactly its `required-features`: a test that
  # only passes because `--all-features` drags in an unrelated feature fails
  # here.
  exact-features:
    name: test (exact required-features, host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: python3 ci/exact-features.py

  # A target without atomic compare-and-swap: the runtime and the observation
  # facade build with either of portable-atomic's two CAS providers.
  no-cas:
    name: check (thumbv6m, no CAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p embassy-supervisor --target thumbv6m-none-eabi --no-default-features --features control,pool,readiness,liveness-monitor,restart,bound-deps,portable-atomic/critical-section
      - run: cargo check -p embassy-supervisor --target thumbv6m-none-eabi --no-default-features --features control,pool,readiness,liveness-monitor,restart,bound-deps,portable-atomic/unsafe-assume-single-core
      - run: cargo check -p embassy-supervisor-observe --target thumbv6m-none-eabi --features portable-atomic/critical-section

  # `no_std` guard: the crate must still cross-compile for the MCU target (the
  # pinned default) across the feature matrix.
  embedded:
    name: build (thumbv8m, no_std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p embassy-supervisor --no-default-features
      - run: cargo build -p embassy-supervisor --all-features

  # Feature subsets on the pinned embedded target (which also guards no_std):
  # the crate markets `default-features = false`, so every feature must
  # type-check on its own and alongside `macros` if the macro takes it, plus the
  # combinations whose cfg branches only meet together (`pool` without
  # `control`, the trace chain, ...). One job, one cache; a loop, not a runner
  # matrix, because each check takes seconds.
  features:
    name: check (feature matrix, thumbv8m)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Check each supported feature combination
        run: |
          set -e
          for f in "" control pool macros pool,macros control,pool \
                   control,pool,macros defmt trace trace,trace-hooks \
                   trace,trace-hooks,trace-nested trace,trace-names \
                   trace-self trace-self,data-deps \
                   macros,local-resources readiness liveness readiness,pool \
                   control,pool,macros,readiness,liveness heap-state \
                   macros,heap-state epochs liveness-monitor coupling \
                   macros,coupling macros,coupling-observe restart bound-deps macros,bound-deps \
                   log log,macros,coupling \
                   epochs,liveness-monitor,coupling,restart,bound-deps \
                   coupling-observe,liveness-monitor,macros,control \
                   dataflow macros,dataflow node-status \
                   dataflow,readiness,liveness macros,coupling-observe,dataflow \
                   graph-ref macros,graph-ref graph-ref,trace \
                   data-deps macros,data-deps data-deps,readiness \
                   budget macros,budget budget,pool,macros,control \
                   veto macros,veto veto,coupling-observe,macros,pool \
                   lifecycle-events lifecycle-sink lifecycle-events,lifecycle-sink breadcrumb lifecycle-events,breadcrumb \
                   restart-intensity macros,restart-intensity enabled-if macros,enabled-if \
                   local-resources fault-inject macros,fault-inject coupling-observe \
                   metadata-names macros,metadata-names macros,trace macros,trace-hooks trace-nested \
                   lifecycle-events,breadcrumb,restart-intensity,enabled-if,liveness-monitor,macros \
                   control,pool,macros,readiness,liveness,epochs,liveness-monitor,coupling,restart,bound-deps,budget,veto,lifecycle-events,lifecycle-sink,breadcrumb,restart-intensity,enabled-if; do
            echo "::group::features=[${f:-none}]"
            cargo check -p embassy-supervisor --no-default-features ${f:+--features "$f"}
            echo "::endgroup::"
          done

  # The RP2350 demo: it must keep building against the workspace crates, in its
  # default and no-default-features configurations, and lint clean.
  firmware:
    name: build (firmware + bootloader, thumbv8m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p firmware
      - run: cargo build --release -p firmware --no-default-features
      - run: cargo clippy -p firmware -- -D warnings
      - run: cargo build --release -p bootloader

  # The declared `rust-version` (root Cargo.toml) is a promise for the five
  # published crates: check them on exactly that toolchain, against the committed
  # lockfile, on the host and (the runtime) on the MCU target.
  msrv:
    name: check (MSRV 1.88)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --exclude firmware --exclude bootloader --all-features --target "$HOST"
      - run: cargo check --locked -p embassy-supervisor --all-features
      - run: cargo check --locked -p embassy-supervisor
      - run: cargo check --locked -p embassy-supervisor --no-default-features
      - run: cargo check --locked -p embassy-supervisor --target "$HOST"
      - run: cargo check --locked -p embassy-supervisor --no-default-features --target "$HOST"

  # Canary against embassy's main branch (allow-failure): the executor's trace-hook
  # API is documented as unstable, so this job builds and tests the trace feature
  # with embassy-executor patched to git. Main already speaks the post-0.10 hook
  # API (a `Trace` trait registered with `trace_impl!`, `TaskId`/`ExecutorId`),
  # which the supervisor selects with `--cfg embassy_supervisor_trace_v2`; drop
  # the cfg here once the crate pins the release that ships it.
  trace-canary:
    name: trace vs embassy git (canary)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: --cfg embassy_supervisor_trace_v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Patch embassy-executor to git main
        run: |
          # Appending a second `[patch.crates-io]` is a duplicate-key error, so
          # only add one when the checked-out manifest doesn't already patch.
          # The timer-queue crate must move with the executor: embassy-time's
          # queue utils size `TimerQueueItem` through their own copy, and a
          # second copy next to the executor's would let the queue write past
          # the item in every task header (timeouts then never fire).
          if grep -q '^embassy-executor = { git' Cargo.toml; then
            echo "manifest already patches embassy-executor to git; using it as is"
          else
            printf '\n[patch.crates-io]\nembassy-executor = { git = "https://github.com/embassy-rs/embassy" }\nembassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy" }\n' >> Cargo.toml
          fi
          cargo update -p embassy-executor -p embassy-time-queue-utils -p syn@3
          test "$(grep -c 'name = "embassy-executor-timer-queue"' Cargo.lock)" = 1
      - run: cargo build -p embassy-supervisor --target "$HOST" --features trace-hooks,trace-names
      - run: cargo test -p embassy-supervisor --target "$HOST" --features macros,trace-hooks,trace-names,trace-nested,trace-self

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The workspace default target applies to any clippy line without a
          # `--target` override (the observe crate's embedded-view lint below).
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # `--all-targets` so the tests are linted too, not just the lib: the test
      # suite is where the graph DSL is actually exercised, and lint debt there
      # went unseen while this checked the lib alone.
      - run: cargo clippy -p embassy-supervisor --target "$HOST" --all-features --all-targets -- -D warnings
      # The `supervisor_graph!` proc-macro crate (host-only build).
      - run: cargo clippy -p embassy-supervisor-macros --target "$HOST" --all-targets -- -D warnings
      # Host crates, so they need the same `--target $HOST` override as the tests.
      - run: cargo clippy -p embassy-supervisor-syntax --target "$HOST" --all-targets -- -D warnings
      - run: cargo clippy -p embassy-supervisor-tools --target "$HOST" --all-targets -- -D warnings
      # The observation facade builds for both worlds; lint it as its consumers see it.
      - run: cargo clippy -p embassy-supervisor-observe --target "$HOST" --all-targets -- -D warnings
      - run: cargo clippy -p embassy-supervisor-observe -- -D warnings

  docs:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p embassy-supervisor --target "$HOST" --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p embassy-supervisor-macros --target "$HOST" --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p embassy-supervisor-syntax --target "$HOST" --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p embassy-supervisor-tools --target "$HOST" --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc -p embassy-supervisor-observe --target "$HOST" --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
